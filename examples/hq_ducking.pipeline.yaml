project_name: sample
mode: Добавление
usegpu: true

paths:
  workdir: .
  out_dir: out
  input_video: sample.mp4

steps:
  extract_audio: true
  source_separation: true
  residual_suppression: true
  asr_whisperx: true
  translate: true
  tts: true
  merge: true

residual_suppression:
  enabled: false
  threshold_db: -35.0
  ratio: 6.0
  attack_ms: 10
  release_ms: 250
  max_reduction_db: 12.0
  control_gain_db: 0.0
  knee: 2.828427
  cache_enabled: true

audio_merge:
  mode: hq_ducking
  original_track: auto

  tts_gain_db: 0.0
  original_gain_db: 0.0

  ducking:
    enabled: true
    amount_db: 10.0
    threshold_db: -30.0
    attack_ms: 10
    release_ms: 250
    ratio: 6.0
    knee_db: 6.0

  loudness:
    enabled: true
    target_i: -16.0
    true_peak: -1.5
